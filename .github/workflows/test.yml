name: test

# Runs on every branch deliberately. This repository is public, and the secret
# hygiene guard in `npm test` is only a guard on the branches it actually runs
# on. The previous filter named `main`, a branch that does not exist here — the
# default is `prod` — so pushing any working branch ran no checks at all.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  # Every job runs the same pinned Linux image that `scripts/test-linux.sh`
  # builds locally (ci/Dockerfile): node, python, bubblewrap, bun and the
  # pinned Gitleaks are inside it, so a Linux-only failure reproduces before
  # push. Runners are pinned to ubuntu-24.04, not "latest". The wiki is not
  # part of CI: nothing here clones it.
  test:
    runs-on: ubuntu-24.04
    # check-coherence compares the declared tracker transitions against the
    # live issue list and refuses to skip that comparison in CI.
    permissions:
      contents: read
      issues: read
    env:
      CI_IN_PLACE: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # Full history: the v5 migration tests read the v5.0.0 installer commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Runs on its own, before everything else. `npm test` chains with `&&`, so
      # a failure in an unrelated check would otherwise stop the secret guard
      # from ever executing. A leaked credential is the one failure here that
      # cannot be undone by fixing it and re-running — it can only be rotated —
      # so it does not queue behind version and rule-copy checks.
      - name: Secret hygiene (no credentials tracked or publishable)
        run: scripts/test-linux.sh npm run test:secrets

      # The script hides the runner's CI markers: the suite asserts local-mode
      # output. Tests that cover CI mode set them explicitly.
      - name: Run tests
        run: scripts/test-linux.sh node ci/run-tests.js

  # One catalogue file cannot be split by Node's file-level --test-shard:
  # four of five jobs would run zero tests and exit 0. CATALOGUE_SHARD slices
  # the 115 service tests inside the file. Unset, the same file runs them all.
  catalogue-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      CI_IN_PLACE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run catalogue tests (job ${{ strategy.job-index }} of ${{ strategy.job-total }})
        run: CATALOGUE_SHARD=$(( ${{ strategy.job-index }} + 1 ))/${{ strategy.job-total }} scripts/test-linux.sh node --test tests/catalogue-all-services.test.js
        timeout-minutes: 10
