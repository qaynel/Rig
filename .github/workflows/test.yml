name: test

# Runs on every branch deliberately. This repository is public, and the secret
# hygiene guard in `npm test` is only a guard on the branches it actually runs
# on. The previous filter named `main`, a branch that does not exist here — the
# default is `prod` — so pushing any working branch ran no checks at all.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # check-coherence compares the declared tracker transitions against the
    # live issue list and refuses to skip that comparison in CI.
    permissions:
      contents: read
      issues: read
    steps:
      # Full history: the v5 migration tests read the v5.0.0 installer commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Ubuntu 24.04 restricts rootless user namespaces through AppArmor.
      # Rig's ungranted-task network boundary uses a rootless network namespace,
      # so enable the native runner capability and verify it before the suite.
      - name: Prepare task sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user --net -- true

      - name: Restore local wiki
        run: |
          node scripts/ensure-wiki.js
          node scripts/build-wiki-index.js

      # Runs on its own, before everything else. `npm test` chains with `&&`, so
      # a failure in an unrelated check would otherwise stop the secret guard
      # from ever executing. A leaked credential is the one failure here that
      # cannot be undone by fixing it and re-running — it can only be rotated —
      # so it does not queue behind version and rule-copy checks.
      - name: Secret hygiene (no credentials tracked or publishable)
        run: npm run test:secrets

      # The suite asserts local-mode output, not the CI-projected aggregate JSON
      # or ::warning annotations that CI=true selects, so the runner's CI markers
      # are hidden from it. Tests that cover CI mode set them explicitly.
      - name: Run tests
        run: env -u CI -u GITHUB_ACTIONS npm test
        env:
          GITHUB_TOKEN: ${{ github.token }}
