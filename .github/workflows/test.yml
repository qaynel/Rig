name: test

# Runs on every branch deliberately. This repository is public, and the secret
# hygiene guard in `npm test` is only a guard on the branches it actually runs
# on. The previous filter named `main`, a branch that does not exist here — the
# default is `prod` — so pushing any working branch ran no checks at all.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Ubuntu 24.04 restricts rootless user namespaces through AppArmor.
      # Rig's ungranted-task network boundary uses a rootless network namespace,
      # so enable the native runner capability and verify it before the suite.
      - name: Enable rootless network namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user --net -- true

      # The root oracle exercises the bundled MCP runtime before the runtime
      # project's own pretest hook runs, so install it explicitly first.
      - name: Install bundled MCP runtime dependencies
        run: npm ci --prefix rig-mcp --no-audit --no-fund

      # Runs on its own, before everything else. `npm test` chains with `&&`, so
      # a failure in an unrelated check would otherwise stop the secret guard
      # from ever executing. A leaked credential is the one failure here that
      # cannot be undone by fixing it and re-running — it can only be rotated —
      # so it does not queue behind version and rule-copy checks.
      - name: Secret hygiene (no credentials tracked or publishable)
        run: npm run test:secrets

      - name: Run tests
        run: npm test
