name: Feature request
description: Suggest a change to Rig
title: "Request: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Implementers: take a branch from `qa-prod`, open the pull request
        against `qa-prod`, and resolve this issue with `Closes #<n>` in the
        PR body. See CONTRIBUTING.md and docs/open-source-standards.md.
