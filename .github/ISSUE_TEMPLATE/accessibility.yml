name: Accessibility barrier
description: Report a barrier in the docs, installer, or command-line tooling
title: "Accessibility: "
body:
  - type: textarea
    id: task
    attributes:
      label: What you were trying to do
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, and assistive technology and version if you use one.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Implementers: take a branch from `qa-prod`, open the pull request
        against `qa-prod`, and resolve this issue with `Closes #<n>` in the
        PR body. See CONTRIBUTING.md and docs/open-source-standards.md.
