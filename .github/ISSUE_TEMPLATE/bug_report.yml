name: Bug report
description: >-
  Report a problem in Rig. Do not include suspected security vulnerabilities;
  see SECURITY.md.
title: "Bug: "
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Rig version or commit
      placeholder: v6.0.0
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, shell, and Node.js version.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Implementers: take a branch from `qa-prod`, open the pull request
        against `qa-prod`, and resolve this issue with `Closes #<n>` in the
        PR body. See CONTRIBUTING.md and docs/open-source-standards.md.
